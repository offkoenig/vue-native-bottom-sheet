anslateY as the sheet.',peekScaleBg:"Scale background",peekGrabberOnly:"Drag only from the grabber",peekOpen:"Open peek sheet",peekHeader:"Nearby",peekPlaceName:"Sunday Coffee Roasters",peekCategory:"Cafe · Third-wave coffee",peekRating:"4.8",peekReviews:"512 reviews",peekOpenStatus:"Open until 22:00",peekDirections:"Directions",peekCall:"Call",peekBody:"This opens straight to 90%, where the backdrop and scaled background are both fully visible. Drag it down toward the 20% peek and both fade out completely — no dimmed backdrop, no scaled background. A hard flick in either direction jumps straight to the edge instead of stepping one snap at a time.",playgroundKicker:"Playground",playgroundTitle:"Feel the physics change live",playgroundDesc:"Adjust the spring and drag it — the numbers below are the actual props passed to the component in real time.",stiffness:"springStiffness",damping:"springDamping",rubberBand:"rubberBandResistance",threshold:"closeThreshold",playgroundOpen:"Open playground sheet",playgroundHeader:"Physics playground",playgroundBody:"This sheet uses whatever values the sliders on the page currently have. Close it, tweak, reopen.",playgroundBody2:"Under the hood it’s a damped harmonic oscillator, integrated once per frame with semi-implicit Euler — the same equation a real spring follows, not a pre-drawn easing curve. Your swipe’s velocity becomes its initial velocity.",resetDefaults:"Reset to defaults",programmaticKicker:"Programmatic control",programmaticTitle:"Driven from outside, via a template ref",programmaticDesc:"These buttons call sheet.value.snapToIndex(i) and sheet.value.close() directly — no swipe involved.",snapTo:"Snap to {p}%",closeIt:"Close",programmaticHeader:"Remote controlled",programmaticBody:"Opened and resized entirely from buttons outside the sheet.",programmaticStop25:"Peek",programmaticStop60:"Details",programmaticStop100:"Full screen",footerNote:"Full source, README, and physics write-up ship in the package."},ru:{kicker:"Vue 3 · Nuxt 3 · без зависимости от Tailwind",heroTitle:"Шторка, которая ощущается нативно.",heroSubtitle:"Инерция по скорости свайпа, эффект «резинки» и настоящая пружинная физика вместо CSS-таймингов — всё ниже собрано из реального компонента, а не имитация.",install:"npm install vue-native-bottom-sheet",tryIt:"Для полного эффекта пробуйте на тач-устройстве — но и мышью тоже работает.",examplesKicker:"Примеры",examplesTitle:"Шесть вариантов настройки",basicTitle:"Базовый",basicDesc:"Точки прилипания [50, 100] по умолчанию. Быстрый свайп вниз закрывает даже при небольшом протягивании.",basicOpen:"Открыть шторку",basicHeader:"Базовая шторка",basicName:"Алекс Ким",basicRole:"Продуктовый дизайнер · Берлин",basicBio:"Десять лет превращаю расплывчатые ТЗ в готовые интерфейсы. Сейчас увлечён физически достоверным движением — вроде той пружины, что под этой самой шторкой.",basicStatProjects:"Проектов",basicStatFollowers:"Подписчиков",basicStatRating:"Рейтинг",basicBody:"Потяните за хваталку или скролльте контент — когда докрутите до верха, повторное перетягивание вниз потащит уже саму шторку. Попробуйте быстрый свайп вниз.",multiTitle:"Несколько точек прилипания",multiDesc:"Три остановки: 25%, 60%, 100%. Медленный релиз всегда прилипает к ближайшей.",multiOpen:"Открыть шторку",multiHeader:"Точка {n}",multiBody:"Сейчас примерно на точке с индексом {n}. Тяните вверх или вниз, чтобы переключаться — очередь ниже скроллится на 60% и 100%.",nonDismissibleTitle:"Без закрытия жестом",nonDismissibleDesc:"Клик по фону, Escape и свайп ниже нижней точки не действуют — закрывает только кнопка.",nonDismissibleOpen:"Открыть шторку",nonDismissibleHeader:"Нужно подтверждение",nonDismissibleBody:"Эта шторка закрывается только кнопкой ниже. Попробуйте фон, Escape или смахнуть — ничего не произойдёт.",nonDismissibleConfirm:"Понятно, закрыть",themeTitle:"Своя тема",themeDesc:"Тот же компонент, другие CSS-переменные --vbs-* — тёмная поверхность, свой акцент, без Tailwind.",themeOpen:"Открыть штор
