",multiBody:"Currently resting near snap index {n}. Drag up or down to move between stops — the queue below scrolls once you’re at 60% or 100%.",nonDismissibleTitle:"Non-dismissible",nonDismissibleDesc:"Backdrop click, Escape, and dragging past the lowest point all do nothing — only the button closes it.",nonDismissibleOpen:"Open sheet",nonDismissibleHeader:"Confirm required",nonDismissibleBody:"This sheet only closes through the button below. Try the backdrop, Escape, or swiping it away — nothing happens.",nonDismissibleConfirm:"Got it, close",themeTitle:"Custom theme",themeDesc:"Same component, different --vbs-* CSS variables — dark surface, custom accent, no Tailwind involved.",themeOpen:"Open sheet",themeHeader:"Dark theme",themeBody:"Colors here come entirely from CSS custom properties overridden on .vbs-panel — no prop for this, just plain CSS.",fitTitle:"Fits its content",fitDesc:"`:snap-points=\"['content']\"` — no percentage guessing. Height is measured via ResizeObserver.",fitOpen:"Open sheet",fitHeader:"Auto height",fitBody:"This sheet is exactly as tall as its content, nothing more. Add or remove rows below — it re-springs to the new height live, while staying open.",fitAddItem:"Add row",fitRemoveItem:"Remove row",fitItem:"Row {n}",peekTitle:"Peek, iOS-style",peekDesc:'Two snap points: 20% and 90%, opens straight to 90%. `fadeFromIndex="1"` means dragging down to the 20% peek strips the backdrop entirely. `scaleBackground` shrinks and rounds the page behind it, driven by the same live translateY as the sheet.',peekScaleBg:"Scale background",peekGrabberOnly:"Drag only from the grabber",peekOpen:"Open peek sheet",peekHeader:"Nearby",peekPlaceName:"Sunday Coffee Roasters",peekCategory:"Cafe · Third-wave coffee",peekRating:"4.8",peekReviews:"512 reviews",peekOpenStatus:"Open until 22:00",peekDirections:"Directions",peekCall:"Call",peekBody:"This opens straight to 90%, where the backdrop and scaled background are both fully visible. Drag it down toward the 20% peek and both fade out completely — no dimmed backdrop, no scaled background. A hard flick in either direction jumps straight to the edge instead of stepping one snap at a time.",inputsTitle:"Inputs & keyboard",inputsDesc:'A real `<input>` and `<textarea>` inside the sheet — on iOS Safari, focusing one opens the keyboard and the sheet repositions itself above it via visualViewport, without a gap underneath. `auto-focus="input"` also focuses the name field the instant it opens, keyboard included.',inputsOpen:"Open sheet",inputsHeader:"Send feedback",inputsNameLabel:"Name",inputsNamePlaceholder:"Ada Lovelace",inputsMessageLabel:"Message",inputsMessagePlaceholder:"Tap here and the keyboard should push the sheet up cleanly, no matter which snap point it started on…",inputsSubmit:"Send",playgroundKicker:"Playground",playgroundTitle:"Feel the physics change live",playgroundDesc:"Adjust the spring and drag it — the numbers below are the actual props passed to the component in real time.",stiffness:"springStiffness",damping:"springDamping",rubberBand:"rubberBandResistance",threshold:"closeThreshold",playgroundOpen:"Open playground sheet",playgroundHeader:"Physics playground",playgroundBody:"This sheet uses whatever values the sliders on the page currently have. Close it, tweak, reopen.",playgroundBody2:"Under the hood it’s a damped harmonic oscillator, integrated once per frame with semi-implicit Euler — the same equation a real spring follows, not a pre-drawn easing curve. Your swipe’s velocity becomes its initial velocity.",resetDefaults:"Reset to defaults",programmaticKicker:"Programmatic control",programmaticTitle:"Driven from outside, via a template ref",programmaticDesc:"These buttons call sheet.value.snapToIndex(i) and sheet.value.close() directly — no swipe involved.",snapTo:"Snap to {p}%",closeIt:"Close",programmaticHeader:"Remote controlled",programmaticBody:"Opened and resized entirely from buttons outside the sheet.",programmaticStop25:"Peek",programmaticStop6 ема",themeDesc:"Тот же компонент, другие CSS-переменные --vbs-* — тёмная поверхность, свой акцент, без Tailwind.",themeOpen:"Открыть шторку",themeHeader:"Тёмная тема",themeBody:"Цвета здесь целиком заданы через переопределённые CSS-переменные на .vbs-panel — без единого пропа, просто CSS.",fitTitle:"Подстраивается под контент",fitDesc:"`:snap-points=\"['content']\"` — никаких процентов на глаз. Высота измеряется через ResizeObserver.",fitOpen:"Открыть шторку",fitHeader:"Авто-высота",fitBody:"Эта шторка ровно такой высоты, сколько занимает контент — не больше. Добавляйте/убирайте строки ниже — она сама доедет до новой высоты, не закрываясь.",fitAddItem:"Добавить строку",fitRemoveItem:"Убрать строку",fitItem:"Строка {n}",peekTitle:"Peek в стиле iOS",peekDesc:'Две точки: 20% и 90%, открывается сразу на 90%. `fadeFromIndex="1"` значит, что при перетягивании вниз к 20% затемнение фона исчезает полностью. `scaleBackground` уменьшает и скругляет страницу позади — завязано на тот же живой translateY, что и сама шторка.',peekScaleBg:"Масштабировать фон",peekGrabberOnly:"Тянуть только за хваталку",peekOpen:"Открыть peek-шторку",peekHeader:"Рядом с вами",peekPlaceName:"Sunday Coffee Roasters",peekCategory:"Кофейня · спешелти-кофе",peekRating:"4.8",peekReviews:"512 отзывов",peekOpenStatus:"Открыто до 22:00",peekDirections:"Маршрут",peekCall:"Позвонить",peekBody:"Открывается сразу на 90% — фон и затемнение уже полностью видны. Потяните вниз к 20% — оба эффекта полностью исчезают: ни затемнения, ни масштабирования фона. Резкий флик в любую сторону сразу прыгает в крайнюю точку, а не на один шаг.",inputsTitle:"Поля ввода и клавиатура",inputsDesc:'Настоящие `<input>` и `<textarea>` внутри шторки — в iOS Safari фокус на поле открывает клавиатуру, и шторка сама переставляется над ней через visualViewport, без дыры снизу. `auto-focus="input"` сразу же ставит фокус на поле имени при открытии — вместе с клавиатурой.',inputsOpen:"Открыть шторку",inputsHeader:"Обратная связь",inputsNameLa
