 `<textarea>` inside the sheet — on iOS Safari, focusing one opens the keyboard and the sheet repositions itself above it via visualViewport, without a gap underneath. `auto-focus="input"` also focuses the name field the instant it opens, keyboard included.',inputsOpen:"Open sheet",inputsHeader:"Send feedback",inputsNameLabel:"Name",inputsNamePlaceholder:"Ada Lovelace",inputsMessageLabel:"Message",inputsMessagePlaceholder:"Tap here and the keyboard should push the sheet up cleanly, no matter which snap point it started on…",inputsSubmit:"Send",nestedTitle:"Nested sheets",nestedDesc:"A sheet that opens another sheet from its own slot — as deep as you like. Each new one lands on top, the dimming never piles up, Escape unwinds one level at a time.",nestedOpen:"Open level 1",nestedHeader:"Level {n}",nestedLevel:"Sheet #{n}",nestedLevelHint:"Nested inside the previous sheet’s slot",nestedBody:"Open the next level, then drag it down slowly: the sheet underneath brightens exactly as much as the top one fades, so the page never gets darker than under a single sheet. Closing a level also closes every sheet opened from it, and focus goes back to the button that opened it.",nestedOpenNext:"Open level {n}",playgroundKicker:"Playground",playgroundTitle:"Feel the physics change live",playgroundDesc:"Adjust the spring and drag it — the numbers below are the actual props passed to the component in real time.",stiffness:"springStiffness",damping:"springDamping",rubberBand:"rubberBandResistance",threshold:"closeThreshold",playgroundOpen:"Open playground sheet",playgroundHeader:"Physics playground",playgroundBody:"This sheet uses whatever values the sliders on the page currently have. Close it, tweak, reopen.",playgroundBody2:"Under the hood it’s a damped harmonic oscillator, integrated once per frame with semi-implicit Euler — the same equation a real spring follows, not a pre-drawn easing curve. Your swipe’s velocity becomes its initial velocity.",resetDefaults:"Reset to defaults",programmaticKicker:"Programmatic control",programmaticTitle:"Driven from outside, via a template ref",programmaticDesc:"These buttons call sheet.value.snapToIndex(i) and sheet.value.close() directly — no swipe involved.",snapTo:"Snap to {p}%",closeIt:"Close",programmaticHeader:"Remote controlled",programmaticBody:"Opened and resized entirely from buttons outside the sheet.",programmaticStop25:"Peek",programmaticStop60:"Details",programmaticStop100:"Full screen",footerNote:"Full source, README, and physics write-up ship in the package."},ru:{kicker:"Vue 3 · Nuxt 3 · без зависимости от Tailwind",heroTitle:"Шторка, которая ощущается нативно.",heroSubtitle:"Инерция по скорости свайпа, эффект «резинки» и настоящая пружинная физика вместо CSS-таймингов — всё ниже собрано из реального компонента, а не имитация.",install:"npm install vue-native-bottom-sheet",tryIt:"Для полного эффекта пробуйте на тач-устройстве — но и мышью тоже работает.",examplesKicker:"Примеры",examplesTitle:"Восемь вариантов настройки",basicTitle:"Базовый",basicDesc:"Точки прилипания [50, 100] по умолчанию. Быстрый свайп вниз закрывает даже при небольшом протягивании.",basicOpen:"Открыть шторку",basicHeader:"Базовая шторка",basicName:"Алекс Ким",basicRole:"Продуктовый дизайнер · Берлин",basicBio:"Десять лет превращаю расплывчатые ТЗ в готовые интерфейсы. Сейчас увлечён физически достоверным движением — вроде той пружины, что под этой самой шторкой.",basicStatProjects:"Проектов",basicStatFollowers:"Подписчиков",basicStatRating:"Рейтинг",basicBody:"Потяните за хваталку или скролльте контент — когда докрутите до верха, повторное перетягивание вниз потащит уже саму шторку. Попробуйте быстрый свайп вниз.",multiTitle:"Несколько точек прилипания",multiDesc:"Три остановки: 25%, 60%, 100%. Медленный релиз всегда прилипает к ближайшей.",multiOpen:"Открыть шторку",multiHeader:"Точка {n}",multiBody:"Сейчас примерно на точке с индексом {n}. Тяните вверх или вниз, чтобы переключаться — очередь ниже скроллится на 60% и 100%.",nonDismissibleTitle:"Без закрытия жестом",nonDismissibleDesc:"Клик по фону, Escape и свайп ниже нижней точки не действуют — закрывает только кнопка.",nonDismissibleOpen:"Открыть шторку",nonDismissibleHeader:"Нужно подтверждение",nonDismissibleBody:"Эта шторка закрывается только кнопкой ниже. Попробуйте фон, Escape или смахнуть — ничего не произойдёт.",nonDismissibleConfirm:"Понятно, закрыть",themeTitle:"Своя тема",themeDesc:"Тот же компонент, другие CSS-переменные --vbs-* — тёмная поверхность, свой акцент, без Tailwind.",themeOpen:"Открыть шторку",themeHeader:"Тёмная тема",themeBody:"Цвета здесь целиком заданы через переопределённые CSS-переменные на .vbs-panel — без единого пропа, просто CSS.",fitTitle:"Подстраивается под контент",fitDesc:"`:snap-points=\"['content']\"` — никаких процентов на глаз. Высота измеряется через ResizeObserver.",fitOpen:"Открыть шторку",fitHeader:"Авто-высота",fitBody:"Эта шторка ровно такой высоты, сколько занимает контент — не больше. Добавляйте/убирайте строки ниже — она сама доедет до новой высоты, не закрываясь.",fitAddItem:"Добавить строку",fitRemoveItem:"Убрать строку",fitItem:"Строка {n}",peekTitle:"Peek в стиле iOS",peekDesc:'Две точки: 20% и 90%, открывается сразу на 90%. `fadeFromIndex="1"` значит, что при перетягивании вниз к 20% затемнение фона исчезает полностью. `scaleBackground` уменьшает и скругляет страницу позади — завязано на тот же живой translateY, что и сама шторка.',peekScaleBg:"Масштабировать фон",peekGrabberOnly:"Тянуть только за хваталку",peekOpen:"Открыть peek-шторку",peekHeader:"Рядом с вами",peekPlaceName:"Sunday Coffee Roasters",peekCategory:"Кофейня · спешелти-кофе",peekRating:"4.8",peekReviews:"512 отзывов",peekOpenStatus:"Открыто до 22:00",peekDirections:"Маршрут",peekCall:"Позвонить",peekBody:"Открывается сразу на 90% — фон и затемнение уже полностью видны. Потяните вниз к 20% — оба эффекта полностью исчезают: ни затемнения, ни масштабирования фона. Резкий флик в любую сторону сразу прыгает в крайнюю точку, а не на один шаг.",inputsTitle:"Поля ввода и клавиатура",inputsDesc:'Настоящие `<input>` и `<textarea>` внутри шторки — в iOS Safari фокус на поле открывает клавиатуру, и шторка сама переставляется над ней через visualViewport, без дыры снизу. `auto-focus="input"` сразу же ставит фокус на поле имени при открытии — вместе с клавиатурой.',inputsOpen:"Открыть шторку",inputsHeader:"Обратная связь",inputsNameLabel:"Имя",inputsNamePlaceholder:"Ада Лавлейс",inputsMessageLabel:"Сообщение",inputsMessagePlaceholder:"Тапните сюда — клавиатура должна аккуратно поднять шторку, с какой бы точки она ни начинала…",inputsSubmit:"Отправить",nestedTitle:"Вложенные шторки",nestedDesc:"Шторка открывает другую шторку прямо из своего слота — на любую глубину. Каждая новая ложится сверху, затемнение не копится, Escape закрывает по одному уровню.",nestedOpen:"Открыть уровень 1",nestedHeader:"Уровень {n}",nestedLevel:"Шторка №{n}",nestedLevelHint:"Вложена в слот предыдущей шторки",nestedBody:"Откройте следующий уровень и медленно потяните его вниз: нижняя шторка светлеет ровно настолько, насколько гаснет верхняя, так что страница никогда не темнее, чем под одной шторкой. Закрытие уровня закрывает и все шторки, открытые из него, а фокус возвращается на кнопку, которая его открыла.",nestedOpenNext:"Открыть уровень {n}",playgroundKicker:"Плейграунд",playgroundTitle:"Почувствуйте физику вживую",playgroundDesc:"Меняйте параметры пружины и тяните шторку — цифры ниже реально передаются в компонент как пропы.",stiffness:"springStiffness",damping:"springDamping",rubberBand:"rubberBandResistance",threshold:"closeThreshold",playgroundOpen:"Открыть шторку-плейграунд",playgroundHeader:"Физика вживую",playgroundBody:"Эта шторка использует те значения, что сейчас выставлены на слайдерах. Закройте, покрутите, откройте снова.",playgroundBody2:"Под капотом — затухающий гармонический осциллятор, интегрируемый раз за кадр методом полунеявного Эйлера, а не заранее нарисованная easing-кривая. Скорость
