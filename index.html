utton below. Try the backdrop, Escape, or swiping it away — nothing happens.",nonDismissibleConfirm:"Got it, close",themeTitle:"Custom theme",themeDesc:"Same component, different --vbs-* CSS variables — dark surface, custom accent, no Tailwind involved.",themeOpen:"Open sheet",themeHeader:"Dark theme",themeBody:"Colors here come entirely from CSS custom properties overridden on .vbs-panel — no prop for this, just plain CSS.",fitTitle:"Fits its content",fitDesc:"`:snap-points=\"['content']\"` — no percentage guessing. Height is measured via ResizeObserver.",fitOpen:"Open sheet",fitHeader:"Auto height",fitBody:"This sheet is exactly as tall as its content, nothing more. Add or remove rows below — it re-springs to the new height live, while staying open.",fitAddItem:"Add row",fitRemoveItem:"Remove row",fitItem:"Row {n}",peekTitle:"Peek, iOS-style",peekDesc:'Two snap points: 20% and 90%, opens straight to 90%. `fadeFromIndex="1"` means dragging down to the 20% peek strips the backdrop entirely. `scaleBackground` shrinks and rounds the page behind it, driven by the same live translateY as the sheet.',peekScaleBg:"Scale background",peekGrabberOnly:"Drag only from the grabber",peekOpen:"Open peek sheet",peekHeader:"Nearby",peekPlaceName:"Sunday Coffee Roasters",peekCategory:"Cafe · Third-wave coffee",peekRating:"4.8",peekReviews:"512 reviews",peekOpenStatus:"Open until 22:00",peekDirections:"Directions",peekCall:"Call",peekBody:"This opens straight to 90%, where the backdrop and scaled background are both fully visible. Drag it down toward the 20% peek and both fade out completely — no dimmed backdrop, no scaled background. A hard flick in either direction jumps straight to the edge instead of stepping one snap at a time.",inputsTitle:"Inputs & keyboard",inputsDesc:"A real `<input>` and `<textarea>` inside the sheet — on iOS Safari, focusing one opens the keyboard and the sheet repositions itself above it via visualViewport, without a gap underneath.",inputsOpen:"Open sheet",inputsHeader:"Send feedback",inputsNameLabel:"Name",inputsNamePlaceholder:"Ada Lovelace",inputsMessageLabel:"Message",inputsMessagePlaceholder:"Tap here and the keyboard should push the sheet up cleanly, no matter which snap point it started on…",inputsSubmit:"Send",playgroundKicker:"Playground",playgroundTitle:"Feel the physics change live",playgroundDesc:"Adjust the spring and drag it — the numbers below are the actual props passed to the component in real time.",stiffness:"springStiffness",damping:"springDamping",rubberBand:"rubberBandResistance",threshold:"closeThreshold",playgroundOpen:"Open playground sheet",playgroundHeader:"Physics playground",playgroundBody:"This sheet uses whatever values the sliders on the page currently have. Close it, tweak, reopen.",playgroundBody2:"Under the hood it’s a damped harmonic oscillator, integrated once per frame with semi-implicit Euler — the same equation a real spring follows, not a pre-drawn easing curve. Your swipe’s velocity becomes its initial velocity.",resetDefaults:"Reset to defaults",programmaticKicker:"Programmatic control",programmaticTitle:"Driven from outside, via a template ref",programmaticDesc:"These buttons call sheet.value.snapToIndex(i) and sheet.value.close() directly — no swipe involved.",snapTo:"Snap to {p}%",closeIt:"Close",programmaticHeader:"Remote controlled",programmaticBody:"Opened and resized entirely from buttons outside the sheet.",programmaticStop25:"Peek",programmaticStop60:"Details",programmaticStop100:"Full screen",footerNote:"Full source, README, and physics write-up ship in the package."},ru:{kicker:"Vue 3 · Nuxt 3 · без зависимости от Tailwind",heroTitle:"Шторка, которая ощущается нативно.",heroSubtitle:"Инерция по скорости свайпа, эффект «резинки» и настоящая пружинная физика вместо CSS-таймингов — всё ниже собрано из реального компонента, а не имитация.",install:"npm install vue-native-bottom-sheet",tryIt:"Для полного эффекта пробуйте на тач-устройстве — но и мышью тоже работает."
